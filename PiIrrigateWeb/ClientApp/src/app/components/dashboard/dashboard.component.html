<h2 class="title">Dashboard</h2>
<div class="dashboard-controls" style="margin-bottom: 16px;">
  <mat-form-field appearance="fill" style="width: 220px;">
    <mat-label>Select a zone</mat-label>
    <mat-select [(ngModel)]="selectedZoneId" (selectionChange)="onZoneChange()">
      <mat-option *ngFor="let zone of zones" [value]="zone.zoneId">
        {{ zone.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>
<div class="dashboard-widgets">
   @for( w of store.widgets(); track w.id) {
   <app-widget [data]="w"></app-widget>
   }
</div>
