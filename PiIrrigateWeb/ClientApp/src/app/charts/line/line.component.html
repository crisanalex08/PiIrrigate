<div class="chart-feature-selector" style="margin-bottom: 1em;">
  <label *ngFor="let feature of availableFeatures" style="margin-right: 1em;">
    <input type="checkbox" [value]="feature" [(ngModel)]="featureSelections[feature]" (change)="onFeatureSelectionChange()" />
    {{ feature }}
  </label>
</div>
<div class="chart-container">
  <canvas #myChartCanvas id="MyChart"> {{chart}} </canvas>
</div>
